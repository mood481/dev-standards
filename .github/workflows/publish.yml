name: Publish stable package

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  publish:
    name: Publish stable package to Gitea
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Resolve stable release tag
        id: release_ref
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run release:stable-ref

      - name: Check out release revision
        if: steps.release_ref.outputs.publish == 'true'
        run: git checkout --detach "refs/tags/${{ steps.release_ref.outputs.tag }}"

      - name: Validate registry configuration
        if: steps.release_ref.outputs.publish == 'true'
        env:
          GITEA_NPM_REGISTRY: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
        shell: bash
        run: |
          if [ -z "$GITEA_NPM_REGISTRY" ]; then
            echo "::error::GITEA_NPM_REGISTRY is not configured as an Actions variable or secret."
            exit 1
          fi
          case "$GITEA_NPM_REGISTRY" in
            http://*|https://*) ;;
            *)
              echo "::error::GITEA_NPM_REGISTRY must be a full http(s) URL."
              exit 1
              ;;
          esac

      - name: Set up Node.js
        if: steps.release_ref.outputs.publish == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          registry-url: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
          scope: '@mood481'
          package-manager-cache: false

      - name: Validate package
        if: steps.release_ref.outputs.publish == 'true'
        run: npm test

      - name: Inspect package contents
        if: steps.release_ref.outputs.publish == 'true'
        run: npm pack --dry-run

      - name: Publish package
        if: steps.release_ref.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_NPM_REGISTRY: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
        run: npm publish --registry "$GITEA_NPM_REGISTRY" --tag latest

      - name: Advance next channel when behind stable
        if: steps.release_ref.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: node tools/advance-next.mjs --apply
