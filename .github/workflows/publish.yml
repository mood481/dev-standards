name: Publish package

# All package publication is tag-driven:
# - prerelease tags (v<core>-{devel|alpha|beta|rc}.N) publish on tag push;
# - stable tags (v<core>) publish on tag push only when the tagged commit is
#   contained in main.
# Prereleases never publish the docsite. Stable tags publish npm latest and
# advance next when needed. package.json holds the release line and CI stamps
# the exact tag version before validation and publication.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Gitea
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Gate release channel
        id: gate
        shell: bash
        run: |
          set -eu

          tag="$GITHUB_REF_NAME"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(devel|alpha|beta|rc)\.(0|[1-9][0-9]*)$'

          if printf '%s' "$tag" | grep -Eq "$prerelease"; then
            echo "stable=false" >>"$GITHUB_OUTPUT"
            echo "Publishing prerelease tag $tag."
            exit 0
          fi

          if ! printf '%s' "$tag" | grep -Eq "$stable"; then
            echo "::error::Unsupported release tag $tag."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tagged_rev="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tagged_rev" refs/remotes/origin/main; then
            echo "::error::Stable tag $tag must point to a commit contained in main."
            exit 1
          fi

          echo "stable=true" >>"$GITHUB_OUTPUT"
          echo "Publishing stable tag $tag from main."

      - name: Validate registry configuration
        env:
          GITEA_NPM_REGISTRY: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
        shell: bash
        run: |
          if [ -z "$GITEA_NPM_REGISTRY" ]; then
            echo "::error::GITEA_NPM_REGISTRY is not configured as an Actions variable or secret."
            exit 1
          fi

          case "$GITEA_NPM_REGISTRY" in
            http://*|https://*) ;;
            *)
              echo "::error::GITEA_NPM_REGISTRY must be a full http(s) URL."
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          registry-url: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
          scope: '@mood481'
          package-manager-cache: false

      - name: Resolve release plan
        id: release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: tag
        run: npm run release:plan -- --stamp

      - name: Validate package
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_NPM_REGISTRY: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --registry "$GITEA_NPM_REGISTRY" --tag "$DIST_TAG"

      - name: Advance next channel when behind stable
        if: steps.gate.outputs.stable == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: node tools/advance-next.mjs --apply
