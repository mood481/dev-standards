name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Gitea
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate registry configuration
        env:
          GITEA_NPM_REGISTRY: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
        shell: bash
        run: |
          if [ -z "$GITEA_NPM_REGISTRY" ]; then
            echo "::error::GITEA_NPM_REGISTRY is not configured as an Actions variable or secret."
            exit 1
          fi

          case "$GITEA_NPM_REGISTRY" in
            http://*|https://*) ;;
            *)
              echo "::error::GITEA_NPM_REGISTRY must be a full http(s) URL."
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          registry-url: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
          scope: '@mood481'
          package-manager-cache: false

      - name: Resolve release plan
        id: release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: npm run release:plan

      - name: Validate package
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_NPM_REGISTRY: ${{ vars.GITEA_NPM_REGISTRY || secrets.GITEA_NPM_REGISTRY }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --registry "$GITEA_NPM_REGISTRY" --tag "$DIST_TAG"
