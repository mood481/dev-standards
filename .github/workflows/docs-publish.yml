# Stable docsite publication to the tools-docs aggregator.
#
# Stable releases are tag-driven. A pushed v<major>.<minor>.<patch> tag
# publishes documentation only when the tagged commit is contained in main.
# workflow_dispatch is retained for recovery/backfill.
name: docs-publish

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish, for example v0.3.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Resolve stable release tag
        id: release_ref
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          REQUIRE_MAIN: 'true'
          MAIN_POLICY: ${{ github.event_name == 'push' && 'skip' || 'error' }}
        run: npm run release:stable-ref

      - name: Check out release revision
        if: steps.release_ref.outputs.publish == 'true'
        run: git checkout --detach "refs/tags/${{ steps.release_ref.outputs.tag }}"

      - name: Set up Node.js
        if: steps.release_ref.outputs.publish == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Build complete docsite
        if: steps.release_ref.outputs.publish == 'true'
        run: |
          set -eu
          node scripts/docs/build-docsite.mjs
          test -f dist/docs-site/index.html

      - name: Verify site path contract
        if: steps.release_ref.outputs.publish == 'true'
        run: node scripts/docs/verify-site-paths.mjs

      - name: Check out current tools-docs main
        if: steps.release_ref.outputs.publish == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: mood481/tools-docs
          ref: main
          path: tools-docs
          token: ${{ secrets.TOOLS_DOCS_TOKEN }}
          fetch-depth: 0

      - name: Publish subtree to tools-docs
        if: steps.release_ref.outputs.publish == 'true'
        env:
          TOOLS_DOCS_TOKEN: ${{ secrets.TOOLS_DOCS_TOKEN }}
        run: |
          set -eu
          : "${TOOLS_DOCS_TOKEN:?TOOLS_DOCS_TOKEN secret is not configured}"
          sh scripts/docs/publish-to-tools-docs.sh dist/docs-site tools-docs "${{ steps.release_ref.outputs.revision }}" --push
