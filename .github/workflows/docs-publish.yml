# dev-standards docsite publication to the tools-docs aggregator.
#
# Stable documentation is published when a PR with an exact v<major>.<minor>.<patch>
# tag on its head commit is merged into main. Prerelease tag pushes never invoke
# this workflow.
#
# workflow_dispatch exists for recovery/backfill of an already merged stable tag.
#
# dev-standards owns only its documentation subtree site/dev-standards/. The
# site-wide deployment belongs to mood481/tools-docs.
name: docs-publish

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish, for example v0.3.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Resolve stable release tag
        id: release_ref
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git fetch --tags --force origin
          git fetch --no-tags origin main:refs/remotes/origin/main

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"

            if ! printf '%s' "$tag" | grep -Eq "$stable"; then
              echo "::error::Manual doc publication requires a stable tag v<major>.<minor>.<patch>."
              exit 1
            fi

            tagged_rev="$(git rev-list -n 1 "$tag")"
            if ! git merge-base --is-ancestor "$tagged_rev" refs/remotes/origin/main; then
              echo "::error::Stable tag $tag is not contained in main."
              exit 1
            fi

            echo "publish=true" >>"$GITHUB_OUTPUT"
            echo "tag=$tag" >>"$GITHUB_OUTPUT"
            echo "rev=$tagged_rev" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          matches="$(
            git tag --points-at "$PR_HEAD_SHA" |
              while IFS= read -r tag; do
                if printf '%s' "$tag" | grep -Eq "$stable"; then
                  printf '%s\n' "$tag"
                fi
              done
          )"

          count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$count" = "0" ]; then
            echo "Merged PR head has no stable release tag; docs publication is not required."
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$count" != "1" ]; then
            echo "::error::Expected one stable release tag on merged PR head $PR_HEAD_SHA, found $count."
            printf '%s\n' "$matches"
            exit 1
          fi

          tag="$(printf '%s\n' "$matches" | sed '/^$/d')"
          echo "publish=true" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "rev=$PR_HEAD_SHA" >>"$GITHUB_OUTPUT"

      - name: Check out release revision
        if: steps.release_ref.outputs.publish == 'true'
        shell: bash
        run: git checkout --detach "refs/tags/${{ steps.release_ref.outputs.tag }}"

      - name: Set up Node.js
        if: steps.release_ref.outputs.publish == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Align package version with release tag
        if: steps.release_ref.outputs.publish == 'true'
        env:
          GITHUB_REF_NAME: ${{ steps.release_ref.outputs.tag }}
          GITHUB_REF_TYPE: tag
        run: npm run release:plan -- --stamp

      - name: Build complete docsite
        if: steps.release_ref.outputs.publish == 'true'
        run: |
          set -eu
          node scripts/docs/build-docsite.mjs
          test -f dist/docs-site/index.html

      - name: Verify site path contract
        if: steps.release_ref.outputs.publish == 'true'
        run: node scripts/docs/verify-site-paths.mjs

      - name: Check out current tools-docs main
        if: steps.release_ref.outputs.publish == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: mood481/tools-docs
          ref: main
          path: tools-docs
          token: ${{ secrets.TOOLS_DOCS_TOKEN }}
          fetch-depth: 0

      - name: Publish subtree to tools-docs
        if: steps.release_ref.outputs.publish == 'true'
        env:
          TOOLS_DOCS_TOKEN: ${{ secrets.TOOLS_DOCS_TOKEN }}
        run: |
          set -eu
          : "${TOOLS_DOCS_TOKEN:?TOOLS_DOCS_TOKEN secret is not configured}"
          sh scripts/docs/publish-to-tools-docs.sh dist/docs-site tools-docs "${{ steps.release_ref.outputs.rev }}" --push
