# dev-standards docsite publication to the tools-docs aggregator.
#
# Publication is tag-driven. Only a stable tag v<major>.<minor>.<patch> whose
# tagged commit is contained in main publishes documentation. Prerelease tags
# publish package channels only and never update tools-docs.
#
# dev-standards owns only its documentation subtree site/dev-standards/. The
# site-wide deployment belongs to mood481/tools-docs.
#
# Cross-repository write uses the fine-grained PAT secret TOOLS_DOCS_TOKEN
# with Contents: read/write on mood481/tools-docs.
name: docs-publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Gate stable main release
        id: gate
        shell: bash
        run: |
          set -eu

          tag="$GITHUB_REF_NAME"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(devel|alpha|beta|rc)\.(0|[1-9][0-9]*)$'

          if printf '%s' "$tag" | grep -Eq "$prerelease"; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "Skipping docsite publication for prerelease tag $tag."
            exit 0
          fi

          if ! printf '%s' "$tag" | grep -Eq "$stable"; then
            echo "::error::Unsupported release tag $tag."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tagged_rev="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tagged_rev" refs/remotes/origin/main; then
            echo "::error::Stable tag $tag must point to a commit contained in main."
            exit 1
          fi

          echo "publish=true" >>"$GITHUB_OUTPUT"
          echo "rev=$tagged_rev" >>"$GITHUB_OUTPUT"
          echo "Publishing docsite for stable tag $tag from main."

      - name: Set up Node.js
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Align package version with release tag
        if: steps.gate.outputs.publish == 'true'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: tag
        run: npm run release:plan -- --stamp

      - name: Build complete docsite
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -eu
          node scripts/docs/build-docsite.mjs
          test -f dist/docs-site/index.html

      - name: Verify site path contract
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/docs/verify-site-paths.mjs

      - name: Check out current tools-docs main
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: mood481/tools-docs
          ref: main
          path: tools-docs
          token: ${{ secrets.TOOLS_DOCS_TOKEN }}
          fetch-depth: 0

      - name: Publish subtree to tools-docs
        if: steps.gate.outputs.publish == 'true'
        env:
          TOOLS_DOCS_TOKEN: ${{ secrets.TOOLS_DOCS_TOKEN }}
        run: |
          set -eu
          : "${TOOLS_DOCS_TOKEN:?TOOLS_DOCS_TOKEN secret is not configured}"
          sh scripts/docs/publish-to-tools-docs.sh dist/docs-site tools-docs "${{ steps.gate.outputs.rev }}" --push
